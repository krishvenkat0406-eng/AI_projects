<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI SQL Data Analyst Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 30px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4 text-center">🤖 Self-Correcting SQL Analyst Agent</h2>
    
    <div classcard p-4">
        <label for="question" class="form-label fw-bold">Ask a Business Question:</label>
        <div class="input-group">
            <input type="text" id="question" class="form-control" placeholder="e.g., Show top 5 customers by total revenue in Q3 with order counts">
            <button class="btn btn-primary" onclick="submitQuery()">Execute Agent</button>
        </div>
    </div>

    <div id="loading" class="text-center d-none my-4">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Generating SQL & executing query...</p>
    </div>

    <div id="results" class="d-none">
        <div class="card p-4">
            <h5>Generated SQL Query</h5>
            <pre><code id="sqlDisplay"></code></pre>
            <p><strong>Status Log:</strong> <span id="logDisplay" class="badge bg-info"></span></p>
        </div>

        <div class="card p-4">
            <h5>Data Summary Table</h5>
            <div id="tableDisplay" class="table-responsive"></div>
        </div>

        <div class="card p-4">
            <h5>Visualization</h5>
            <div id="chartDisplay"></div>
        </div>
    </div>
</div>

<script>
async function submitQuery() {
    const question = document.getElementById("question").value;
    if (!question) return alert("Please enter a question.");

    document.getElementById("loading").classList.remove("d-none");
    document.getElementById("results").classList.add("d-none");

    const res = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
    });
    const data = await res.json();

    document.getElementById("loading").classList.add("d-none");
    document.getElementById("results").classList.remove("d-none");

    document.getElementById("sqlDisplay").innerText = data.sql_query;
    document.getElementById("logDisplay").innerText = data.error;
    document.getElementById("tableDisplay").innerHTML = data.table_html;
    
    const chartContainer = document.getElementById("chartDisplay");
    chartContainer.innerHTML = data.chart_html;
    Array.from(chartContainer.querySelectorAll("script")).forEach(oldScript => {
        const newScript = document.createElement("script");
        newScript.text = oldScript.text;
        document.body.appendChild(newScript);
    });
}
</script>
</body>
</html>
